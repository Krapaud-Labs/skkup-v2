name: CI

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.18"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Preflight manifests and lockfiles
        run: bash .github/scripts/preflight.sh
      - name: Check public repository security baseline
        run: bash .github/scripts/security-check.sh
      - name: Install locked dependencies
        run: uv sync --project backend --locked --extra dev && npm ci --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Lint backend scaffold
        run: uv run --project backend --locked --extra dev ruff check backend/app backend/migrations
      - name: Build web and container images
        run: npm --prefix frontend run build && docker compose build
      - name: Smoke test isolated local scaffold
        run: bash .github/scripts/verify-scaffold.sh
