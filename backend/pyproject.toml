[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "skkup-v2-foundation"
version = "0.1.0"
description = "Minimal database migration scaffold for Skkup V2"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "psycopg[binary]==3.3.9",
    "SQLAlchemy==2.0.57",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
