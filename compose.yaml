name: skkup-v2

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: skkup_v2
      POSTGRES_USER: skkup_v2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skkup-local-only}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: skkup_v2
      POSTGRES_USER: skkup_v2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skkup-local-only}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: skkup_v2
      POSTGRES_USER: skkup_v2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skkup-local-only}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
